# Build the Kingpin Android APK in GitHub Actions.
#
# The APK contains the engine, touch controls, renderers and the
# Kingpin game library. Game data (main/*.pak) is NOT needed to build -
# it is read from the phone at runtime; see android/README.md.
#
# The APK is signed with the Android debug key (android/debug.keystore,
# the well known "android" debug identity): the APK installs on any
# device and keeps the same signature across builds. Release builds
# keep full native optimization.
#
# Trigger manually (Actions -> Android build -> Run workflow) or push
# to master / the arena branch; pushing a v* tag publishes a release.

name: Android build

on:
  workflow_dispatch:
    inputs:
      make_release:
        description: "Create a GitHub release with the results"
        type: boolean
        default: true
  push:
    branches:
      - master
      - arena/40e53c9c-yquake2remaster
    tags:
      - "v*"

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  ANDROID_NDK_VERSION: 26.1.10909125
  ANDROID_BUILD_TOOLS: 34.0.0

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK packages
        run: |
          set -e
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SDKMANAGER" ] || SDKMANAGER="$(command -v sdkmanager)"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" --install \
            "platforms;android-34" \
            "build-tools;$ANDROID_BUILD_TOOLS" \
            "ndk;$ANDROID_NDK_VERSION"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$ANDROID_NDK_VERSION" >> "$GITHUB_ENV"

      - name: Install CMake 3.31+ (root CMakeLists requires 3.31)
        run: |
          python3 -m pip install --user --break-system-packages --upgrade "cmake>=3.31" ninja
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          # Remove the SDK-shipped CMake 3.22.1 so AGP falls back to PATH.
          rm -rf "$ANDROID_HOME/cmake"

      - name: Fetch SDL2
        run: android/fetch_deps.sh

      - name: Verify Kingpin game module ABI
        run: android/check_abi.sh

      - name: Build Kingpin game library
        run: android/build_game_lib.sh

      - name: Build APK
        run: android/build_apk.sh release

      - name: Upload Gradle log (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-build-log
          path: android/gradle-build.log
          if-no-files-found: ignore

      - name: Sign APK (Android debug key)
        run: |
          set -e
          BT="$ANDROID_HOME/build-tools/$ANDROID_BUILD_TOOLS"
          echo "==> Looking for the APK in android/app/build/outputs:"
          find android/app/build/outputs -type f -name '*.apk' -print 2>/dev/null || true

          UNSIGNED="$(find android/app/build/outputs -type f -name '*.apk' 2>/dev/null | head -n 1 || true)"
          if [ -z "$UNSIGNED" ]; then
            echo "::error title=Sign APK::no APK found in android/app/build/outputs"
            exit 1
          fi
          echo "==> Signing: $UNSIGNED"

          "$BT/zipalign" -f -p 4 "$UNSIGNED" "$RUNNER_TEMP/aligned.apk" \
            || { echo "::error title=Sign APK::zipalign failed"; exit 1; }
          "$BT/apksigner" sign \
            --ks android/debug.keystore \
            --ks-type pkcs12 \
            --ks-pass pass:android \
            --key-pass pass:android \
            --ks-key-alias androiddebugkey \
            --out android/kingpin-android.apk \
            "$RUNNER_TEMP/aligned.apk" \
            || { echo "::error title=Sign APK::apksigner sign failed"; exit 1; }
          "$BT/apksigner" verify android/kingpin-android.apk \
            || { echo "::error title=Sign APK::apksigner verify failed"; exit 1; }
          echo "==> Signed APK ready: android/kingpin-android.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: kingpin-android-apk
          path: android/kingpin-android.apk
          if-no-files-found: error

      - name: Create GitHub release
        if: >-
          (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
          (github.event_name == 'workflow_dispatch' && inputs.make_release)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            TAG="$GITHUB_REF_NAME"
          else
            TAG="android-build-$GITHUB_RUN_NUMBER"
          fi
          NOTES="Automatic Android build (run $GITHUB_RUN_NUMBER)."
          NOTES="$NOTES Install the APK, then copy the game data (main/*.pak)"
          NOTES="$NOTES into the data folder shown by the launcher."
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" android/kingpin-android.apk --clobber
          else
            gh release create "$TAG" android/kingpin-android.apk \
              --title "Android build $TAG" --notes "$NOTES"
          fi
          echo "==> Release: $TAG"
